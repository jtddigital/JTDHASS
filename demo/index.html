<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JTD Calendar Card demo</title>
    <style>
      :root {
        --primary-color: #009ac7;
        --text-primary-color: #fff;
        --primary-text-color: #141414;
        --secondary-text-color: #5e5e5e;
        --divider-color: rgba(0, 0, 0, 0.12);
        --card-background-color: #fff;
        --ha-card-background: #fff;
        --primary-background-color: #fafafa;
        --warning-color: #ffa600;
        --error-color: #db4437;
        --ha-card-border-radius: 12px;
        --ha-card-border-color: #e0e0e0;
        --color-1: #4269d0;
        --color-2: #f4bd4a;
        --color-3: #ff725c;
        --red-color: #f44336;
        --green-color: #4caf50;
        --purple-color: #926bc7;
        font-family: Roboto, Noto, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      :root.dark {
        --primary-color: #009ac7;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --divider-color: rgba(225, 225, 225, 0.12);
        --card-background-color: #1c1c1c;
        --ha-card-background: #1c1c1c;
        --primary-background-color: #111111;
        --ha-card-border-color: #2c2c2c;
      }
      body {
        margin: 0;
        padding: 24px;
        background: var(--primary-background-color);
        color: var(--primary-text-color);
      }
      #cards {
        display: grid;
        gap: 24px;
        max-width: var(--demo-width, 1100px);
      }
    </style>
    <script type="module">
      import * as mdi from "../node_modules/@mdi/js/mdi.js";

      // Minimal stand-ins for Home Assistant's ha-card and ha-icon.
      customElements.define(
        "ha-card",
        class extends HTMLElement {
          constructor() {
            super();
            this.attachShadow({ mode: "open" }).innerHTML = `<style>
              :host { display:block; background: var(--ha-card-background); border-radius: var(--ha-card-border-radius);
                border: 1px solid var(--ha-card-border-color); color: var(--primary-text-color); }
            </style><slot></slot>`;
          }
        },
      );
      customElements.define(
        "ha-icon",
        class extends HTMLElement {
          static observedAttributes = ["icon"];
          set icon(value) {
            this._icon = value;
            this._render();
          }
          get icon() {
            return this._icon;
          }
          attributeChangedCallback(_n, _o, value) {
            this.icon = value;
          }
          _render() {
            const name =
              "mdi" +
              (this._icon || "")
                .replace("mdi:", "")
                .split("-")
                .map((p) => p[0].toUpperCase() + p.slice(1))
                .join("");
            const path = mdi[name] || "";
            const root = this.shadowRoot || this.attachShadow({ mode: "open" });
            root.innerHTML = `<svg viewBox="0 0 24 24" style="width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);fill:currentColor;display:block"><path d="${path}"/></svg>`;
          }
        },
      );
    </script>
  </head>
  <body>
    <div id="cards"></div>
    <script type="module">
      import "../dist/jtd-calendar-card.js";
      import { createHass } from "./mock-hass.js";

      const params = new URLSearchParams(location.search);
      if (params.get("theme") === "dark") document.documentElement.classList.add("dark");
      if (params.get("width")) document.documentElement.style.setProperty("--demo-width", `${params.get("width")}px`);

      const base = {
        type: "custom:jtd-calendar-card",
        entities: [
          { entity: "calendar.family", name: "Family" },
          { entity: "calendar.work", color: "purple" },
          "calendar.holidays",
        ],
        weather_entity: "weather.home",
        temperature_entity: "sensor.outdoor_temperature",
        open_meteo: true,
      };
      const variants = {
        month: { ...base, title: "Family calendar" },
        weeks: { ...base, view: "weeks", weeks: 2 },
        weeks1: { ...base, view: "weeks", weeks: 1, past_weeks: 0 },
        plain: { ...base, open_meteo: false, temperature_entity: undefined, show_legend: false },
      };
      const variant = params.get("variant") || "month";
      const card = document.createElement("jtd-calendar-card");
      card.setConfig(variants[variant]);
      card.hass = createHass();
      document.getElementById("cards").append(card);
      window.card = card;
    </script>
  </body>
</html>
